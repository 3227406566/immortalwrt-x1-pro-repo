name: Build ImmortalWrt for Oray X1 Pro

on:
  push:
    branches: [ main ]
  workflow_dispatch: # 支持网页手动点击触发，不用提交代码

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出本仓库 (补丁与配置文件)
        uses: actions/checkout@v4

      - name: 拉取ImmortalWrt源码
        run: |
          git clone https://github.com/immortalwrt/immortalwrt.git
          cd immortalwrt
          git pull

      - name: 复制补丁、UA3F包、.config到源码目录
        run: |
          cp .config ./immortalwrt/
          cp -r files ./immortalwrt/

      - name: 缓存编译目录（加速后续编译）
        uses: actions/cache@v4
        with:
          path: |
            ./immortalwrt/build_dir
            ./immortalwrt/staging_dir
            ./immortalwrt/feeds
          key: ${{ runner.os }}-immwrt-${{ hashFiles('./.config') }}
          restore-keys: |
            ${{ runner.os }}-immwrt-

      - name: 安装编译依赖包
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget

      - name: 更新 & 安装 feeds
        run: |
          cd immortalwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 生成配置 (非交互,跳过menuconfig)
        run: |
          cd immortalwrt
          make defconfig

      - name: 开始编译固件
        run: |
          cd immortalwrt
          make -j$(nproc)

      - name: 列出固件目录【调试查看是否生成bin】
        run: ls -la ./immortalwrt/bin/targets/mediatek/filogic/

      - name: 上传编译好的固件
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-X1Pro-Firmware
          path: ./immortalwrt/bin/targets/mediatek/filogic/*.bin
