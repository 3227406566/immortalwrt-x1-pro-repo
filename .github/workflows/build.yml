name: Build ImmortalWrt for Oray X1 Pro
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: 检出本仓库（补丁与配置文件）
        uses: actions/checkout@v4
        with:
          path: myrepo

      - name: 拉取ImmortalWrt源码
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: master
          path: openwrt

      - name: 复制补丁、UA3F包、.config到源码目录
        run: |
          cp -r $GITHUB_WORKSPACE/myrepo/files/* $GITHUB_WORKSPACE/openwrt/
          cp $GITHUB_WORKSPACE/myrepo/.config $GITHUB_WORKSPACE/openwrt/.config

      - name: 安装编译依赖包
        run: |
          cd $GITHUB_WORKSPACE/openwrt
          sudo apt update
          sudo apt install -y build-essential libncurses-dev gawk flex bison openssl libssl-dev dkms libelf-dev libudev-dev libpci-dev libiberty-dev autoconf git python3 python3-pip

      - name: 更新 & 安装 feeds
        run: |
          cd $GITHUB_WORKSPACE/openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 生成配置（非交互，跳过menuconfig）
        run: |
          cd $GITHUB_WORKSPACE/openwrt
          export TERM=xterm
          make defconfig

      - name: 开始编译固件
        run: |
          cd $GITHUB_WORKSPACE/openwrt
          export TERM=xterm
          make -j$(nproc)

      - name: 上传编译好的固件
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-X1Pro-Firmware
          path: $GITHUB_WORKSPACE/openwrt/bin/targets/mediatek/filogic/
